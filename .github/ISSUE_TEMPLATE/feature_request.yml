name: Feature request
description: Suggest an idea for Zusk.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the problem or the workflow, not just the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
      description: How you imagine it working in Zusk.
  - type: textarea
    id: alternatives
    attributes:
      label: Anything else?
      description: Workarounds you use today, or how other tools handle it.
