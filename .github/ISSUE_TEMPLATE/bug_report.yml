name: Bug report
description: Something in Zusk doesn't work as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. For security problems, please follow [SECURITY.md](https://github.com/shubhranka-z/zusk/blob/main/SECURITY.md) instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the SQL you ran, if any. Leave out real data and credentials.
      placeholder: |
        1. Connect to …
        2. Run …
        3. See …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Zusk version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Windows
        - Linux
    validations:
      required: true
  - type: input
    id: postgres
    attributes:
      label: PostgreSQL version
      description: Shown in the connection pill at the top of the window.
      placeholder: "16.4"
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or error messages
