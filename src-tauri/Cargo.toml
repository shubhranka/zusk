[package]
name = "zusk"
version = "0.1.0"
description = "Zusk — a desktop PostgreSQL client"
authors = ["Shubhranka Varma"]
license = "MIT"
repository = "https://github.com/shubhranka/zusk"
edition = "2021"

[lib]
name = "zusk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[lints.clippy]
# AppError carries Postgres' message, detail, hint and positions straight to
# the UI. It is only built on failure paths, so its size doesn't matter.
result_large_err = "allow"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "macros", "rt-multi-thread"] }
tokio-postgres = "0.7"
postgres-native-tls = "0.5"
native-tls = "0.2"
futures-util = "0.3"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
# AI provider calls. native-tls matches the Postgres TLS stack above;
# reqwest's default would pull in rustls and aws-lc as well.
reqwest = { version = "0.13", default-features = false, features = ["json", "native-tls", "system-proxy"] }
# Jinja templating for the editor (Superset-style SQL). pycompat adds the
# Python string/dict methods templates lean on (.split(), .get(), …).
minijinja = { version = "2", features = ["loop_controls", "json"] }
minijinja-contrib = { version = "2", features = ["pycompat"] }

# Only for examples/dev_bridge.rs (browser-based UI development) and tests.
[dev-dependencies]
axum = "0.8"
tower-http = { version = "0.6", features = ["cors"] }
tokio = { version = "1", features = ["full"] }
